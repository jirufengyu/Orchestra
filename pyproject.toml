[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent"
version = "0.1.0"
description = "A lightweight, policy-agnostic embodied agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai"]
mobile = [
    "matplotlib",
    "msgpack",
    "msgpack-numpy",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "websockets>=14.2",
]
annotation = ["flask>=3.1,<4", "numpy>=1.26,<2", "pillow>=11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["embodied_agent*", "annotation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
